<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitrix - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">

    <div class="box">
        <div class="logo-group">
            <img src="img/Logo.jpg" alt="Logo" class="logo" width="60">
            <h1>Fitrix</h1>
        </div>
        <nav class="nav-menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="progress.html">Progress</a>
            <a href="goals.html">Goals</a>
        </nav>
    </div>

    <div class="dashboard-content">
        <div class="header-text">
            <h2 id="userName">Hi, Lunar!</h2>
            <p>วันนี้คุณเข้าใกล้น้ำหนักเป้าหมายมากขึ้นแล้ว!</p>
        </div>

        <div class="dashboard-grid">
            <div class="card card-blue">
                <span>น้ำหนักวันนี้</span>
                <h3 id="currentWeightDisplay">0 kg</h3>
                <img src="img/scale.png" class="card-icon" alt="Scale">
            </div>

            <div class="card card-orange">
                <span>แคลอรี่วันนี้</span>
                <h3>0/2,000 kcal</h3>
                <img src="img/Fire.png" class="card-icon">
            </div>

            <div class="card card-green">
                <span>ออกกำลังกาย</span>
                <h3>0 นาที</h3>
                <img src="img/exercise.png" class="card-icon">
            </div>

            <div class="card card-cyan">
                <span>น้ำที่ดื่ม</span>
                <h3>0 ml</h3>
                <img src="img/waterdrop.png" class="card-icon">
            </div>
        </div>

        <div class="footer-action">
            <button class="add-btn">+</button>
        </div>
    </div>
<script src="script.js"></script>
    <div id="dataModal" class="modal">
    <div class="modal-content">
        <h3>บันทึกข้อมูลวันนี้</h3>
        <div class="input-group">
            <label>น้ำหนัก (kg):</label>
            <input type="number" id="inputWeight" placeholder="เช่น 52">
        </div>
        <div class="input-group">
            <label>แคลอรี่ (kcal):</label>
            <input type="number" id="inputCal" placeholder="เช่น 1250">
        </div>
        <div class="input-group">
            <label>เวลาออกกำลังกาย (นาที):</label>
            <input type="number" id="inputEx" placeholder="เช่น 30">
        </div>
        <div class="input-group">
            <label>ปริมาณน้ำ (ml):</label>
            <input type="number" id="inputWater" placeholder="เช่น 3000">
        </div>
        <div class="modal-btns">
            <button onclick="closeModal()" class="cancel-btn">ยกเลิก</button>
            <button onclick="saveData()" class="save-btn">บันทึก</button>
        </div>
    </div>
</div>
</body>
</html>
