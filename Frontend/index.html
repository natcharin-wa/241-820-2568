<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #7dd3fc, #a5b4fc);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #f8fbff;
            width: 420px;
            padding: 28px 32px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.25);
        }

        .header {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 24px;
            color: #4338ca;
        }

        .flex {
            display: flex;
            align-items: center;
        }

        .center {
            display: flex;
            justify-content: center;
        }

        .form-input {
            margin-bottom: 16px;
            color: #1e3a8a;
        }

        .header-form {
            width: 80px;
            font-weight: 600;
        }

        .form,
        textarea {
            flex: 1;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #bfdbfe;
            background: #ffffff;
            outline: none;
            transition: 0.25s;
        }

        .form:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .gender .flex div {
            margin-right: 16px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            accent-color: #6366f1;
        }

        textarea {
            width: 100%;
            height: 85px;
            resize: none;
        }

        .button {
            background: linear-gradient(135deg, #60a5fa, #818cf8);
            color: #ffffff;
            border: none;
            padding: 11px 30px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .button:hover {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Register Form</div>

        <div class="flex form-input">
            <div class="header-form">ชื่อ</div>
            <input class="form" name="firstname" type="text">
        </div>

        <div class="flex form-input">
            <div class="header-form">นามสกุล</div>
            <input class="form" name="lastname" type="text">
        </div>

        <div class="flex form-input">
            <div class="header-form">อายุ</div>
            <input class="form" name="age" type="number" min="0" max="100">
        </div>

        <div class="flex gender form-input">
            <div class="header-form">เพศ</div>
            <div class="flex">
                <div>
                    <input name="gender" type="radio" value="ชาย"> ชาย
                </div>
                <div>
                    <input name="gender" type="radio" value="หญิง"> หญิง
                </div>
                <div>
                    <input name="gender" type="radio" value="อื่นๆ"> อื่นๆ
                </div>
            </div>
        </div>

        <div class="form-input">
            งานอดิเรก
            <div>
                <input name="interest" type="checkbox" value="อ่านหนังสือ"> อ่านหนังสือ
            </div>
            <div>
                <input name="interest" type="checkbox" value="ดูหนัง"> ดูหนัง
            </div>
            <div>
                <input name="interest" type="checkbox" value="ฟังเพลง"> ฟังเพลง
            </div>
        </div>

        <div class="form-input">
            คำอธิบาย
            <textarea name="description"></textarea>
        </div>

        <div class="center">
            <button class="button">ส่งข้อมูล</button>
        </div>
    </div>

</body>
</html>
