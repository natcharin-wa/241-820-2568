<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitrix - Register</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="box">
    <div class="logo-group">
        <img src="img/Logo.jpg" alt="Logo" class="logo">
        <h1>Fitrix</h1>
    </div>
    
    </div>

    <div class="container">
        <h2>สมัครสมาชิก</h2>

        <form id="registerForm">
            <div class="field">
                <div class="label-box">
                    <img src="img/email.jpg" class="icon" alt="email icon">
                    <label for="email">อีเมล</label>
                </div>
                <input type="email" id="email" placeholder="ระบุอีเมลของคุณ" required>
            </div>

            <div class="field">
                <div class="label-box">
                    <img src="img/password.jpg" class="icon" alt="password icon">
                    <label for="password">รหัสผ่าน</label>
                </div>
                <input type="password" id="password" placeholder="ตั้งรหัสผ่าน" required>
            </div>

            <div class="field">
                <div class="label-box">
                    <img src="img/password.jpg" class="icon" alt="password icon">
                    <label for="confirm-password">ยืนยันรหัสผ่าน</label>
                </div>
                <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
            </div>

            <input type="submit" value="ยืนยันการสมัคร">
        </form>

        <p class="register-text">
            มีบัญชีอยู่แล้ว? <a href="index.html">เข้าสู่ระบบที่นี่</a>
        </p>
    </div>

</body>
</html>
